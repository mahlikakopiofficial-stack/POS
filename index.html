<div class="shell">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand-mark" title="RESTAU">R.</div>
    <button class="nav-btn active" data-view="pos"><span class="ico">▦</span><span>Cashier</span></button>
    <button class="nav-btn" data-view="kitchen"><span class="ico">♨</span><span>Kitchen</span></button>
    <button class="nav-btn" data-view="menu"><span class="ico">☷</span><span>Menu</span></button>
    <button class="nav-btn" data-view="reports"><span class="ico">▤</span><span>Reports</span></button>
    <div class="nav-spacer"></div>

    <div style="font-size:9px;color:#cbb7be;margin-top:4px">v0.1</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="page-title" id="pageTitle">Cashier</div><div class="subtitle" id="pageSubtitle">Take orders quickly. The local hub keeps the service running.</div></div>
      <div class="top-right">
        <span class="status-pill" id="networkStatus"><span class="dot"></span><span>Network checking</span></span>
        <span class="status-pill cloud-pill" title="Cloud synchronization is not connected in this prototype">◌ <span id="syncLabel">Local only · cloud pending</span></span>
        <div class="avatar" title="Demo owner">OW</div>
      </div>
    </header>
    <div class="content">
      <section class="view active" id="view-pos"></section>
      <section class="view" id="view-kitchen"></section>
      <section class="view" id="view-menu"></section>
      <section class="view" id="view-reports"></section>
      <section class="view" id="view-settings"></section>
      <div class="footer-note">RESTAU POS UI prototype · Sample data is stored in this browser only · Not for live sales</div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  if(state.settingsTab==="general")return '<div class="panel settings-content"><div class="panel-head"><h3>Restaurant details</h3><span class="status-tag">Local settings</span></div><form id="settingsForm"><div class="form-section"><div class="form-grid"><div class="field"><label for="s-restaurantName">Restaurant name</label><input id="s-restaurantName" data-setting="restaurantName" value="'+escapeHtml(s.restaurantName)+'" required></div><div class="field"><label for="s-phone">Phone</label><input id="s-phone" data-setting="phone" value="'+escapeHtml(s.phone)+'" placeholder="+965 ..."></div><div class="field"><label for="s-address">Address</label><input id="s-address" data-setting="address" value="'+escapeHtml(s.address)+'"></div><div class="field"><label for="s-currency">Currency</label><select id="s-currency" data-setting="currency"><option value="KWD" selected>KWD — Kuwaiti dinar</option></select></div><div class="field"><label for="s-timezone">Timezone</label><select id="s-timezone" data-setting="timezone"><option value="Asia/Kuwait" selected>Asia/Kuwait</option></select></div><div class="field"><label for="s-footer">Receipt footer</label><input id="s-footer" data-setting="receiptFooter" value="'+escapeHtml(s.receiptFooter)+'"></div></div></div><div class="form-section"><h3 class="section-title">Cashier behavior</h3>'+toggleRow("Auto-print customer receipt","Print after a completed payment","autoPrintReceipt",s.autoPrintReceipt)+toggleRow("Auto-print kitchen ticket","Queue kitchen tickets after sending an order","autoPrintKitchen",s.autoPrintKitchen)+toggleRow("Require a reason for voids","Record the reason and staff member for void operations","requireVoidReason",s.requireVoidReason)+'</div><div class="setting-savebar"><span class="help">Settings save to this browser in the prototype.</span><button class="btn primary" type="submit">Save settings</button></div></form></div>';
  if(state.settingsTab==="printers")return '<div class="panel settings-content"><div class="panel-head"><h3>Printer setup & kitchen routing</h3><span class="badge-demo">Hardware not connected</span></div><form id="settingsForm"><div class="form-section"><h3 class="section-title">Receipt printer</h3><div class="form-grid"><div class="field"><label for="s-receiptPrinterName">Printer name</label><input id="s-receiptPrinterName" data-setting="receiptPrinterName" value="'+escapeHtml(s.receiptPrinterName)+'"></div><div class="field"><label for="s-receiptPrinterIp">Local IP address</label><input id="s-receiptPrinterIp" data-setting="receiptPrinterIp" value="'+escapeHtml(s.receiptPrinterIp)+'" placeholder="192.168.1.101"></div></div>'+toggleRow("Enable receipt printer","Queue customer receipts for this destination","receiptPrinterEnabled",s.receiptPrinterEnabled)+'</div><div class="form-section"><h3 class="section-title">Kitchen printer</h3><div class="form-grid"><div class="field"><label for="s-kitchenPrinterName">Printer name</label><input id="s-kitchenPrinterName" data-setting="kitchenPrinterName" value="'+escapeHtml(s.kitchenPrinterName)+'"></div><div class="field"><label for="s-kitchenPrinterIp">Local IP address</label><input id="s-kitchenPrinterIp" data-setting="kitchenPrinterIp" value="'+escapeHtml(s.kitchenPrinterIp)+'" placeholder="192.168.1.102"></div></div>'+toggleRow("Enable kitchen printer","Queue kitchen tickets for this destination","kitchenPrinterEnabled",s.kitchenPrinterEnabled)+'</div><div class="form-section"><h3 class="section-title">Category routing</h3><p class="help" style="margin-top:-7px;margin-bottom:13px">In production, these rules will be enforced by the local hub. This prototype stores your selections only.</p><div class="form-grid">'+state.categories.map(c=>'<div class="field"><label for="route-'+escapeHtml(c)+'">'+escapeHtml(c)+' destination</label><select id="route-'+escapeHtml(c)+'" data-route="'+escapeHtml(c)+'"><option '+((s.routing[c]||"Kitchen Printer")==="Kitchen Printer"?"selected":"")+' value="Kitchen Printer">Kitchen Printer</option><option '+((s.routing[c]||"")==="Drinks Printer"?"selected":"")+' value="Drinks Printer">Drinks Printer</option><option '+((s.routing[c]||"")==="Dessert Printer"?"selected":"")+' value="Dessert Printer">Dessert Printer</option><option '+((s.routing[c]||"")==="No print"?"selected":"")+' value="No print">No print</option></select></div>').join("")+'</div><div class="notice" style="margin-top:14px">Before purchasing: verify supported ESC/POS or vendor printer protocols, LAN connectivity, cutter support and status reporting. An IP address alone does not connect hardware.</div></div><div class="setting-savebar"><span class="help">Printer test button is a preview only.</span><div class="actions"><button class="btn" type="button" data-action="test-printer">Test print</button><button class="btn primary" type="submit">Save routing</button></div></div></form></div>';
  if(state.settingsTab==="charges")return '<div class="panel settings-content"><div class="panel-head"><h3>Tax & service charges</h3><span class="status-tag amber">Disabled by default</span></div><form id="settingsForm"><div class="form-section"><div class="notice">Charges are disabled until you confirm the applicable business and tax rules. Enabling a setting below changes prototype calculations only; it does not determine legal tax treatment.</div>'+toggleRow("Enable tax","Apply a configurable percentage to the subtotal","taxEnabled",s.taxEnabled)+'<div class="field" style="max-width:220px;margin:0 0 10px"><label for="s-taxRate">Tax rate (%)</label><input id="s-taxRate" data-setting="taxRate" type="number" min="0" max="100" step="0.01" value="'+Number(s.taxRate||0)+'"></div>'+toggleRow("Enable service charge","Apply a configurable percentage to the subtotal","serviceEnabled",s.serviceEnabled)+'<div class="field" style="max-width:220px;margin-top:10px"><label for="s-serviceRate">Service charge (%)</label><input id="s-serviceRate" data-setting="serviceRate" type="number" min="0" max="100" step="0.01" value="'+Number(s.serviceRate||0)+'"></div></div><div class="setting-savebar"><span class="help">Disabled settings are excluded from order totals.</span><button class="btn primary" type="submit">Save charge settings</button></div></form></div>';
  if(state.settingsTab==="staff")return '<div class="panel settings-content"><div class="panel-head"><h3>Staff roles & permissions</h3><button class="btn small" data-action="staff-demo">＋ Add staff (demo)</button></div><div class="form-section"><div class="staff-row"><div class="staff-avatar">OW</div><div class="staff-text"><b>Owner / Administrator</b><small>All settings, staff access, backups, reports, voids and refunds</small></div><span class="status-tag green">Full access</span></div><div class="staff-row"><div class="staff-avatar">MG</div><div class="staff-text"><b>Manager</b><small>Orders, approved discounts, voids, cash shifts and reports</small></div><span class="status-tag">Manager</span></div><div class="staff-row"><div class="staff-avatar">CS</div><div class="staff-text"><b>Cashier</b><small>Create orders, take payments and print receipts</small></div><span class="status-tag">Cashier</span></div><div class="staff-row"><div class="staff-avatar">KT</div><div class="staff-text"><b>Kitchen</b><small>View / update kitchen tickets only</small></div><span class="status-tag">Kitchen</span></div></div><div class="form-section"><div class="notice">Role descriptions are illustrative in this UI prototype. Production authentication must be enforced by the local hub; hiding buttons is not security. PIN hashes, session expiry and audit logging will be implemented in the backend.</div>'+toggleRow("Allow cashier discounts","Manager authorization can still be required in production","allowDiscounts",s.allowDiscounts)+toggleRow("Require manager approval for refunds","Prevents cashier-only refund actions","requireManagerRefund",s.requireManagerRefund)+'</div><div class="setting-savebar"><span class="help">No real user accounts or PINs are created yet.</span><button class="btn primary" data-action="save-staff-settings">Save permissions</button></div></div>';
  return '<div class="panel settings-content"><div class="panel-head"><h3>Local backup & cloud synchronization</h3><span class="status-tag amber">Cloud not connected</span></div><div class="form-section"><div class="kpi-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="panel kpi"><div class="kpi-top"><span>Local orders</span><span class="kpi-icon">▤</span></div><div class="kpi-value">'+state.orders.length+'</div><div class="kpi-foot">Saved in this browser</div></div><div class="panel kpi"><div class="kpi-top"><span>Pending sync</span><span class="kpi-icon">◌</span></div><div class="kpi-value">'+state.orders.filter(o=>!o.synced).length+'</div><div class="kpi-foot">Cloud connector not implemented</div></div></div><div class="notice">This prototype persists its demo data in browser storage only. It is not yet the local POS hub database and does not automatically upload orders. The planned production version will use a local PostgreSQL database, durable outbox, encrypted cloud backups and retry-safe synchronization.</div><div class="actions" style="margin-top:15px"><button class="btn primary" data-action="export-backup">Download local JSON backup</button><button class="btn" data-action="restore-backup">Restore JSON backup</button><button class="btn" data-action="export-csv">Export orders CSV</button></div></div><div class="form-section"><h3 class="section-title">Required production behavior</h3><div class="toggle-row"><div><b>Local hub is the source of truth</b><small>Orders save locally before cloud sync is attempted.</small></div><span class="status-tag green">Required</span></div><div class="toggle-row"><div><b>Durable pending-sync queue</b><small>Retry after internet returns; unique event IDs avoid duplicates.</small></div><span class="status-tag green">Required</span></div><div class="toggle-row"><div><b>Encrypted cloud backup and restore tests</b><small>Keep off-device copies and periodically test recovery.</small></div><span class="status-tag green">Required</span></div></div><div class="setting-savebar"><span class="help">No live sync is claimed by this prototype.</span><button class="btn danger" data-action="reset-demo">Reset demo data</button></div></div>';
}
function toggleRow(label,help,key,value){return '<div class="toggle-row"><div><b>'+label+'</b><small>'+help+'</small></div><button class="switch '+(value?"on":"")+'" type="button" role="switch" aria-checked="'+!!value+'" data-action="toggle-setting" data-key="'+key+'"><span></span></button></div>'}
function renderSettings(){
  const root=document.getElementById("view-settings");
  root.innerHTML='<div class="row-between" style="margin-bottom:16px;flex-wrap:wrap"><div><div class="eyebrow">System administration</div><h2 style="margin:5px 0 0;font-size:21px">POS settings</h2><div class="subtitle">The owner will be able to configure these from the production application.</div></div><span class="status-tag amber">Prototype settings only</span></div><div class="settings-grid">'+settingNav()+settingContent()+'</div>';
}
function moveTicket(orderId,status){
  const o=state.orders.find(x=>x.id===orderId);if(!o)return;
  o.status=status;
  if(status==="completed")o.completedAt=new Date().toISOString();
  persist();renderKitchen();notify(o.number+" marked "+statusName(status).toLowerCase()+".");
}
function exportBlob(filename,mime,text){
  const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportBackup(){
  const backup={format:"restau-pos-prototype-backup",version:1,exportedAt:new Date().toISOString(),state:state};
  exportBlob("restau-pos-demo-backup-"+new Date().toISOString().slice(0,10)+".json","application/json",JSON.stringify(backup,null,2));
  notify("Local demo backup downloaded.");
}
function exportCSV(){
  const columns=["order_number","created_at","order_type","table","customer","subtotal_kwd","tax_kwd","service_kwd","total_kwd","payment_status","payment_method","kitchen_status"];
  const lines=[columns.join(",")].concat(state.orders.map(o=>[o.number,o.createdAt,o.type,o.table||"",o.customerName||"",o.subtotal,o.tax,o.service,o.total,o.paymentStatus,o.paymentMethod,o.status].map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")));
  exportBlob("restau-pos-orders-"+new Date().toISOString().slice(0,10)+".csv","text/csv;charset=utf-8",lines.join("\r\n"));
  notify("Orders CSV downloaded.");
}
function editItem(itemId){
  const item=state.menu.find(x=>x.id===itemId);if(!item)return;
  const name=prompt("Menu item name:",item.name);if(name===null)return;
  const priceText=prompt("Price in KWD (e.g. 1.500):",Number(item.price).toFixed(3));if(priceText===null)return;
  const price=Number(priceText);
  if(!name.trim()||!Number.isFinite(price)||price<0){notify("Name and a valid non-negative price are required.");return}
  item.name=name.trim();item.price=Math.round(price*1000)/1000;
  const route=prompt("Kitchen destination (Kitchen Printer / Drinks Printer / Dessert Printer / No print):",item.route||"Kitchen Printer");
  if(route!==null&&route.trim())item.route=route.trim();
  persist();renderMenu();notify("Menu item updated.");
}
function makeNewItem(form){
  const name=document.getElementById("newItemName").value.trim();
  const price=Number(document.getElementById("newItemPrice").value);
  if(!name||!Number.isFinite(price)||price<0){notify("Enter a valid item name and price.");return}
  const category=document.getElementById("newItemCategory").value;
  const emoji=document.getElementById("newItemEmoji").value.trim()||"🍽️";
  const route=document.getElementById("newItemRoute").value;
  const description=document.getElementById("newItemDescription").value.trim();
  state.menu.push({id:id(),name,category,price:Math.round(price*1000)/1000,emoji,description,route,available:true});
  persist();renderMenu();notify(name+" added to the menu.");
}
document.addEventListener("click",function(event){
  const nav=event.target.closest("[data-view]");
  if(nav){switchView(nav.dataset.view);return}
  const button=event.target.closest("[data-action]");if(!button)return;
  const action=button.dataset.action;
  if(action==="add-item"){addItem(button.dataset.id);return}
  if(action==="order-type"){state.selectedType=button.dataset.type;renderPOS();persist();return}
  if(action==="select-table"){state.selectedTable=button.dataset.table;renderPOS();persist();return}
  if(action==="category-filter"){state.categoryFilter=button.dataset.category;renderPOS();return}
  if(action==="qty"){const l=state.cart.find(x=>x.id===button.dataset.id);if(l){l.qty+=Number(button.dataset.delta);if(l.qty<=0)state.cart=state.cart.filter(x=>x.id!==l.id);persist();renderPOS()}return}
  if(action==="remove-line"){state.cart=state.cart.filter(x=>x.id!==button.dataset.id);persist();renderPOS();return}
  if(action==="clear-cart"){state.cart=[];persist();renderPOS();notify("Current order cleared.");return}
  if(action==="send-kitchen"){state.paymentMethod="Pay later";createOrder("kitchen");return}
  if(action==="charge-send"){const select=document.getElementById("paymentMethod");state.paymentMethod=select?select.value:"Cash";createOrder(state.paymentMethod);return}
  if(action==="ticket-status"){moveTicket(button.dataset.id,button.dataset.status);return}
  if(action==="record-cash"){const order=state.orders.find(x=>x.id===button.dataset.id);if(order){order.paymentStatus="paid";order.paymentMethod="Cash";order.paidAt=new Date().toISOString();order.synced=false;persist();renderKitchen();notify("Cash payment recorded in demo for "+order.number+".")}return}
  if(action==="refresh-view"){renderKitchen();notify("Kitchen board refreshed from local demo data.");return}
  if(action==="toggle-availability"){const item=state.menu.find(x=>x.id===button.dataset.id);if(item){item.available=!item.available;persist();renderMenu();notify(item.name+(item.available?" is available.":" marked sold out."))}return}
  if(action==="edit-item"){editItem(button.dataset.id);return}
  if(action==="add-item-form"){document.getElementById("newItemName")?.focus();return}
  if(action==="add-category"){const name=prompt("New category name:");if(name&&name.trim()){const v=name.trim();if(state.categories.some(c=>c.toLowerCase()===v.toLowerCase())){notify("Category already exists.");return}state.categories.push(v);state.settings.routing[v]="Kitchen Printer";persist();renderMenu();notify("Category added.")}return}
  if(action==="settings-tab"){state.settingsTab=button.dataset.tab;renderSettings();return}
  if(action==="toggle-setting"){
    const key=button.dataset.key;state.settings[key]=!state.settings[key];persist();renderSettings();notify("Setting updated locally.");return
  }
  if(action==="test-printer"){notify("Preview only: connect a supported printer to the local hub to send a real test print.");return}
  if(action==="save-staff-settings"){persist();notify("Demo permission settings saved.");return}
  if(action==="export-backup"){exportBackup();return}
  if(action==="export-csv"){exportCSV();return}
  if(action==="restore-backup"){document.getElementById("restoreFile").click();return}
  if(action==="reset-demo"){if(confirm("Reset all local prototype orders, settings and menu changes to the sample data? Download a backup first if needed.")){localStorage.removeItem(STORAGE_KEY);state=structuredClone(defaults);persist();renderView();notify("Prototype data reset.")}return}
  if(action==="save-settings"){persist();notify("Settings saved.");return}
});
document.addEventListener("input",function(event){
  if(event.target.id==="menuSearch"){state.search=event.target.value;const pos=document.getElementById("view-pos");const start=event.target.selectionStart;renderPOS();const input=document.getElementById("menuSearch");if(input){input.focus();input.setSelectionRange(start,start)}return}
});
document.addEventListener("change",function(event){
  if(event.target.id==="paymentMethod"){state.paymentMethod=event.target.value;return}
  const key=event.target.dataset.setting;
  const route=event.target.dataset.route;
  if(key){const val=event.target.type==="number"?Number(event.target.value):event.target.value;state.settings[key]=val;persist();return}
  if(route){state.settings.routing[route]=event.target.value;persist();return}
});
document.addEventListener("submit",function(event){
  if(event.target.id==="addItemForm"){event.preventDefault();makeNewItem(event.target);return}
  if(event.target.id==="settingsForm"){
    event.preventDefault();
    const form=event.target;
    form.querySelectorAll("[data-setting]").forEach(el=>{const key=el.dataset.setting;state.settings[key]=el.type==="number"?Number(el.value):el.value});
    form.querySelectorAll("[data-route]").forEach(el=>{state.settings.routing[el.dataset.route]=el.value});
    persist();renderSettings();notify("Settings saved in local prototype storage.");return
  }
});
document.getElementById("restoreFile").addEventListener("change",async function(event){
  const file=event.target.files&&event.target.files[0];if(!file)return;
  try{
    const parsed=JSON.parse(await file.text());
    const restored=parsed.state||parsed;
    if(!restored||!Array.isArray(restored.menu)||!Array.isArray(restored.orders))throw new Error("Not a RESTAU POS backup");
    if(!confirm("Replace the current browser prototype data with this backup?"))return;
    state=Object.assign(structuredClone(defaults),restored,{settings:Object.assign(structuredClone(defaults.settings),restored.settings||{})});
    persist();renderView();notify("Prototype backup restored.");
  }catch(e){notify("Restore failed. Choose a valid RESTAU POS JSON backup.")}finally{event.target.value=""}
});
window.addEventListener("online",updateHeader);window.addEventListener("offline",updateHeader);
switchView(state.view||"pos");
})();
</script>
</body>
